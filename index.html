<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoryBook</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    #splash {
      position: fixed; inset: 0; z-index: 99999;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: #f8f9fb;
      transition: opacity 0.4s ease, visibility 0.4s ease;
    }
    @media (prefers-color-scheme: dark) { #splash { background: #0f0f14; } }
    #splash.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    #splash .sp-logo {
      width: 56px; height: 56px; margin-bottom: 20px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 12px; color: white;
      display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 18px;
      animation: sp-pulse 2s ease-in-out infinite;
    }
    #splash .sp-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px; font-weight: 600; letter-spacing: 0.5px;
      color: #18181b; margin-bottom: 28px;
    }
    @media (prefers-color-scheme: dark) { #splash .sp-name { color: #e4e4e7; } }
    #splash .sp-bar {
      width: 120px; height: 3px; border-radius: 2px; overflow: hidden;
      background: rgba(99, 102, 241, 0.15);
    }
    #splash .sp-bar-inner {
      width: 40%; height: 100%; border-radius: 2px;
      background: #6366f1;
      animation: sp-slide 1.2s ease-in-out infinite;
    }
    @keyframes sp-slide {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(200%); }
      100% { transform: translateX(-100%); }
    }
    @keyframes sp-pulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="splash">
    <div class="sp-logo">AI</div>
    <div class="sp-name">AI小说编辑器 - 正在加载中...</div>
    <div class="sp-bar"><div class="sp-bar-inner"></div></div>
  </div>
  <script>setTimeout(function(){var s=document.getElementById('splash');if(s){s.classList.add('hide');setTimeout(function(){s.remove()},500)}},3000)</script>
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
